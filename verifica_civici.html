const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,maxNativeZoom:19,attribution:'Esri World Imagery'});
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
sat.addTo(map);let isSat=true;document.getElementById('sat').onclick=()=>{if(isSat){map.removeLayer(sat);osm.addTo(map)}else{map.removeLayer(osm);sat.addTo(map)}isSat=!isSat};
const state=C.map(c=>({ok:false,moved:false}));
try{const s=JSON.parse(localStorage.getItem('verifica_civici')||'null');if(s&&s.length===C.length)s.forEach((x,i)=>{state[i]=x.st;if(x.cur)C[i].cur=x.cur})}catch(e){}
const list=document.getElementById('list');const M=[],G=[],LN=[];
function save(){try{localStorage.setItem('verifica_civici',JSON.stringify(C.map((c,i)=>({st:state[i],cur:c.cur}))))}catch(e){}}
function upd(){document.getElementById('cnt').textContent=' '+state.filter(s=>s.ok).length+'/'+C.length+' confermate';}
function row(i){const c=C[i],s=state[i];const tag=s.ok?'<span class="ok">✔ confermata</span>':(c.st==='approssimato'?'<span class="warn">⚠ approssimata</span>':(c.d>40?'<span class="warn">scarto '+c.d+' m dal vecchio</span>':'da controllare'));
return '<b>'+c.nome.slice(0,48)+'</b><small>'+c.ind+' · '+tag+(s.moved?' · <span class="mod">spostata</span>':'')+'</small>'}
C.forEach((c,i)=>{
 const m=L.marker(c.cur,{draggable:true,title:c.nome}).addTo(map).bindPopup('<b>'+c.nome+'</b><br>'+c.ind);
 const g=L.circleMarker(c.old,{radius:6,color:'#6b7280',fillColor:'#9ca3af',fillOpacity:.8}).addTo(map);
 const ln=L.polyline([c.old,c.cur],{color:'#6b7280',weight:1,dashArray:'3 3'}).addTo(map);
 m.on('dragend',()=>{const p=m.getLatLng();c.cur=[+p.lat.toFixed(7),+p.lng.toFixed(7)];state[i].moved=true;ln.setLatLngs([c.old,c.cur]);d.innerHTML=row(i);save()});
 m.on('click',()=>sel(i));
 const d=document.createElement('div');d.className='it';d.innerHTML=row(i);d.onclick=()=>sel(i);list.appendChild(d);
 M.push(m);LN.push(ln);G.push({d,g});
});
function sel(i){document.querySelectorAll('.it').forEach(x=>x.classList.remove('sel'));G[i].d.classList.add('sel');G[i].d.scrollIntoView({block:'nearest'});
 map.setView(C[i].cur,19);M[i].openPopup();
 M[i].setPopupContent('<b>'+C[i].nome+'</b><br>'+C[i].ind+'<br><button onclick="conf('+i+')">Conferma</button>')}
window.conf=i=>{state[i].ok=true;G[i].d.innerHTML=row(i);save();upd();M[i].closePopup();if(i+1<C.length)sel(i+1)};
upd();
document.getElementById('ex').onclick=()=>{
 const out=FULL.map((r,i)=>{const o=JSON.parse(JSON.stringify(r));o.latitudine=C[i].cur[0];o.longitudine=C[i].cur[1];
  if(state[i].moved)o.descrizione=o.descrizione.map(x=>x.replace(/(Posizione:<\/strong>) .*?<\/li>/,'$1 verificata su satellite</li>'));return o});
 const b=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='associazioni_registrate_verificato.json';a.click()};
</script></body></html>
